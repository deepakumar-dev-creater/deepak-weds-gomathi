<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deepak Kumar &amp; Gomathi — Wedding Invitation | 12 March 2027 • Chennai</title>
  
  <!-- OpenGraph / Social Meta Tags -->
  <meta name="description" content="With the divine blessings of the Almighty and our beloved elders, Deepak Kumar and Gomathi cordially invite you to celebrate their wedding on 12th March 2027 (Reception on 11th March) in Chennai. #DeepakKumarWedsGomathi">
  <meta property="og:title" content="Deepak Kumar &amp; Gomathi — Wedding Invitation">
  <meta property="og:description" content="We cordially invite you to celebrate our Reception on 11th March &amp; Wedding Ceremony on 12th March 2027 in Chennai. #DeepakKumarWedsGomathi">
  <meta property="og:image" content="assets/img/couple_muhurtham.jpg">
  <meta property="og:type" content="website">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: rgb(43, 29, 20);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .hinv-root {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: rgb(43, 29, 20);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 0;
    }
    .hinv-root::before {
      content: "";
      position: absolute;
      inset: -60px;
      background: var(--hinv-bg, url("assets/img/backdrop.webp")) center / cover no-repeat;
      filter: blur(28px) brightness(0.55) saturate(1.1);
      z-index: 0;
    }
    .hinv-root::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(rgba(0, 0, 0, 0) 35%, rgba(0, 0, 0, 0.65) 100%);
      z-index: 0;
    }
    .hinv-frame {
      position: relative;
      z-index: 1;
      width: min(100%, calc(100dvh * 0.5625), 620px);
      height: 100%;
      height: 100dvh;
      border: 0;
      display: block;
      margin: 0 auto;
      background: #0a72db;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(215, 162, 42, 0.28);
      overflow-x: hidden;
    }
    @media (max-width: 600px) {
      .hinv-frame {
        width: 100%;
        height: 100%;
        height: 100dvh;
        box-shadow: none;
        overflow-x: hidden;
      }
    }
  </style>
  <link rel="stylesheet" href="wedding-theme.css">
</head>
<body>
  <div class="hinv-root" style="--hinv-bg: url('assets/img/backdrop.webp');">
    <iframe class="hinv-frame" style="background-color: #0a72db;" src="invite.html?v=9" title="Wedding invitation" allow="autoplay; fullscreen"></iframe>
  </div>

  <script>
    (function () {
      var events = ["click", "pointerdown", "touchstart", "touchend", "touchmove", "scroll", "keydown", "wheel"];
      var forwarded = false;
      var forward = function () {
        if (forwarded) return;
        forwarded = true;
        var iframe = document.querySelector('iframe');
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage({ type: 'invite-kick' }, '*');
        }
        events.forEach(function (ev) { window.removeEventListener(ev, forward, true); });
      };
      events.forEach(function (ev) { window.addEventListener(ev, forward, { capture: true, passive: true }); });

      // Forward mouse wheel scrolling from backdrop to iframe on desktop/laptop
      window.addEventListener('wheel', function (e) {
        var iframe = document.querySelector('iframe');
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage({ type: 'scroll-by', deltaY: e.deltaY }, '*');
        }
      }, { passive: true });

      // Forward keyboard arrow/page navigation to iframe
      window.addEventListener('keydown', function (e) {
        var iframe = document.querySelector('iframe');
        if (!iframe || !iframe.contentWindow) return;
        if (e.key === 'ArrowDown') {
          iframe.contentWindow.postMessage({ type: 'scroll-by', deltaY: 80 }, '*');
        } else if (e.key === 'ArrowUp') {
          iframe.contentWindow.postMessage({ type: 'scroll-by', deltaY: -80 }, '*');
        } else if (e.key === 'PageDown' || e.key === ' ') {
          iframe.contentWindow.postMessage({ type: 'scroll-by', deltaY: window.innerHeight * 0.8 }, '*');
        } else if (e.key === 'PageUp') {
          iframe.contentWindow.postMessage({ type: 'scroll-by', deltaY: -window.innerHeight * 0.8 }, '*');
        }
      });
    })();
  </script>
</body>
</html>
